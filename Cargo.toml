[package]
name = "fastlanes"
version = "0.5.0"
description = "Rust implementation of the FastLanes compression layout"
license = "Apache-2.0"
homepage = "https://github.com/spiraldb/fastlanes"
repository = "https://github.com/spiraldb/fastlanes"
authors = ["SpiralDB <hello@spiraldb.com>"]
keywords = ["fastlanes", "compression", "codec"]
edition = "2021"
rust-version = "1.90.0"

[dependencies]
arrayref = "0.3.7"
const_for = "0.1.4"
core_detect = "1.0.0"
num-traits = "0.2.19"
paste = "1.0.15"
seq-macro = "0.3.5"

[dev-dependencies]
arrayref = "0.3.9"
divan = { package = "codspeed-divan-compat", version = "4.0" }

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(codspeed)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
# enable pedantic lint group with overrides
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
needless_range_loop = "allow"
# opt-in to members of the "restrictions" lint group
if_then_some_else_none = "deny"
mem_forget = "deny"
multiple_inherent_impl = "deny"
or_fun_call = "deny"
panic = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
tests_outside_test_module = "deny"
unwrap_used = "deny"
use_debug = "deny"

[[bench]]
name = "bitpacking"
harness = false

[[bench]]
name = "ffor"
harness = false

[[bench]]
name = "bitpacking_cmp"
harness = false

[[bench]]
name = "bitpacking_cmp_cod"
harness = false

[[bench]]
name = "delta"
harness = false

[[bench]]
name = "transpose"
harness = false

[[bench]]
name = "rle"
harness = false

[[bench]]
name = "bit_transpose"
harness = false
