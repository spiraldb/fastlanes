[package]
name = "fastlanes"
version = "0.7.2"
description = "Rust implementation of the FastLanes compression layout"
license = "Apache-2.0"
homepage = "https://github.com/spiraldb/fastlanes"
repository = "https://github.com/spiraldb/fastlanes"
authors = ["SpiralDB <hello@spiraldb.com>"]
keywords = ["fastlanes", "compression", "codec", "encoding", "lightweight"]
edition = "2024"
rust-version = "1.91"
exclude = [".github/*", "renovate.json", ".git/*"]

[features]
default = ["runtime"]
# Enables runtime CPU feature detection (via `fearless_simd`, which requires `std`).
# The auto-vectorized kernels are additionally compiled for AVX-512 on x86 and that
# copy is selected at runtime when the CPU supports it, as is
# the `transpose_bits`/`untranspose_bits` implementation. Without it, everything is
# resolved at compile time from the enabled `target_feature`s.
runtime = ["dep:fearless_simd"]

[dependencies]
const_for = "0.1"
num-traits = { version = "0.2", default-features = false }
pastey = "0.2"
seq-macro = "0.3"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
fearless_simd = { version = "1.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
arrayref = "0.3"
divan = { package = "codspeed-divan-compat", version = "5.0" }
hegeltest = "0.47.0"

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(codspeed)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
# enable pedantic lint group with overrides
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
needless_range_loop = "allow"
# opt-in to members of the "restrictions" lint group
if_then_some_else_none = "deny"
mem_forget = "deny"
multiple_inherent_impl = "deny"
or_fun_call = "deny"
panic = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
tests_outside_test_module = "deny"
unwrap_used = "deny"
use_debug = "deny"

[[bench]]
name = "bitpacking"
harness = false

[[bench]]
name = "ffor"
harness = false

[[bench]]
name = "bitpacking_cmp"
harness = false

[[bench]]
name = "delta"
harness = false

[[bench]]
name = "transpose"
harness = false

[[bench]]
name = "bit_transpose"
harness = false
required-features = ["runtime"]

[[bench]]
name = "rle"
harness = false
