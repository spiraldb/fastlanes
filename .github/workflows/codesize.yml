name: Code Size

on:
  push:
    branches: [ "develop" ]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codesize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codesize:
    name: Code Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust

      - name: Install llvm-dwarfdump
        run: rustup component add llvm-tools

      - name: Measure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/codesize.py ${BASE_SHA:+--base "$BASE_SHA"} > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Create the report comment on the first run and edit it in place on every later run.
      # Pull requests from forks get a read-only token, so they only get the job summary.
      - name: Post or update PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: codesize
          path: ${{ runner.temp }}/report.md
