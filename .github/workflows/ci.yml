name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Rust Build
        run: |
            cargo build --all-features --all-targets
            cargo build --all-targets
      - name: Rust Lint - Format
        run: cargo fmt --all --check
      - name: Rust Lint - Clippy
        run: |
            cargo clippy --all-features --all-targets
            cargo clippy --all-targets
      - name: Rust Test
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  # Architecture-specific test jobs. They only start once the default `build`
  # job (baseline target features) has passed. Each job runs on a current
  # generation runs-on spot instance whose CPU supports every feature level for
  # that architecture, and runs the feature levels one after the other, from
  # least to most capable. Each level recompiles the crate with those target
  # features enabled so the compile-time dispatch paths are exercised; the
  # `runtime` feature (via `--all-features`) additionally exercises runtime
  # dispatch. Runner spec is kept loose (any family/size in range) so that
  # spot capacity is easy to find.
  test-x86-64:
    name: Test (x86-64)
    needs: build
    # Sapphire/Granite Rapids (c7i/c8i) and Zen 4/5 (c7a/c8a) all support
    # AVX2, BMI2 and AVX-512 F/BW/VBMI.
    runs-on: runs-on=${{ github.run_id }}/cpu=4+16/family=c7i+c7a+m7i+m7a+r7i+r7a+c8i+c8a+m8i+m8a/image=ubuntu24-full-x64/spot=true/tag=test-x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Show CPU
        run: lscpu

      - name: Check CPU features
        run: |
          for f in avx2 bmi2 avx512f avx512bw avx512vbmi; do
            grep -qw "$f" /proc/cpuinfo || { echo "CPU is missing $f"; exit 1; }
          done

      - name: Rust Test - AVX2
        env:
          RUSTFLAGS: "-C target-feature=+avx2,+bmi2"
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

      - name: Rust Test - AVX-512
        env:
          RUSTFLAGS: "-C target-feature=+avx2,+bmi2,+avx512f,+avx512bw,+avx512vbmi"
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  test-aarch64:
    name: Test (aarch64)
    needs: build
    # Graviton3 (c7g) and Graviton4 (c8g) both support NEON and SVE.
    runs-on: runs-on=${{ github.run_id }}/cpu=4+16/family=c7g+m7g+r7g+c8g+m8g+r8g/image=ubuntu24-full-arm64/spot=true/tag=test-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Show CPU
        run: lscpu

      - name: Check CPU features
        run: |
          for f in asimd sve; do
            grep -qw "$f" /proc/cpuinfo || { echo "CPU is missing $f"; exit 1; }
          done

      - name: Rust Test - NEON
        env:
          RUSTFLAGS: "-C target-feature=+neon"
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

      - name: Rust Test - SVE
        env:
          RUSTFLAGS: "-C target-feature=+neon,+sve"
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-msrv
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-msrv

      - name: Verify MSRV
        run: cargo msrv verify

  bench-codspeed:
    name: Benchmark with Codspeed
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c6id.8xlarge
      - image=ubuntu24-full-x64
      - tag=bench-codspeed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install libc debug symbols
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dbg

      - name: Install Codspeed
        shell: bash
        run: cargo install --force cargo-codspeed --locked

      - name: Build benchmarks
        env:
          RUSTFLAGS: "-C target-feature=+avx2"
        run: |
          cargo codspeed build --profile bench --features runtime

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
