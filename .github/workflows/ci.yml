name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Rust Build
        run: |
            cargo build --all-features --all-targets
            cargo build --all-targets
      - name: Rust Lint - Format
        run: cargo fmt --all --check
      - name: Rust Lint - Clippy
        run: |
            cargo clippy --all-features --all-targets
            cargo clippy --all-targets
      - name: Rust Test
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  # Architecture-specific test jobs. These only start once the default `build`
  # job (baseline x86-64 target features) has passed, and each one compiles the
  # crate with the given target features enabled so the compile-time dispatch
  # paths are exercised on hardware that actually supports them. The `runtime`
  # feature (via `--all-features`) additionally exercises runtime dispatch.
  test-x86-64-avx2:
    name: Test (x86-64 AVX2)
    needs: build
    # AMD Zen 3: AVX2 without AVX-512, so runtime dispatch also takes the AVX2 path.
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c6a.2xlarge
      - image=ubuntu24-full-x64
      - tag=test-avx2
    env:
      RUSTFLAGS: "-C target-feature=+avx2,+bmi2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Check CPU features
        run: grep -qw avx2 /proc/cpuinfo && grep -qw bmi2 /proc/cpuinfo
      - name: Rust Test
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  test-x86-64-avx512:
    name: Test (x86-64 AVX-512)
    needs: build
    # Ice Lake: AVX2 and AVX-512 (F, BW, VBMI).
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c6id.2xlarge
      - image=ubuntu24-full-x64
      - tag=test-avx512
    env:
      RUSTFLAGS: "-C target-feature=+avx2,+bmi2,+avx512f,+avx512bw,+avx512vbmi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Check CPU features
        run: grep -qw avx512f /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo && grep -qw avx512vbmi /proc/cpuinfo
      - name: Rust Test
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  test-aarch64-neon:
    name: Test (aarch64 NEON)
    needs: build
    # Graviton2: NEON without SVE.
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c6g.2xlarge
      - image=ubuntu24-full-arm64
      - tag=test-neon
    env:
      RUSTFLAGS: "-C target-feature=+neon"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Check CPU features
        run: grep -qw asimd /proc/cpuinfo
      - name: Rust Test
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  test-aarch64-sve:
    name: Test (aarch64 SVE)
    needs: build
    # Graviton3: NEON and SVE.
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c7g.2xlarge
      - image=ubuntu24-full-arm64
      - tag=test-sve
    env:
      RUSTFLAGS: "-C target-feature=+neon,+sve"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Check CPU features
        run: grep -qw sve /proc/cpuinfo
      - name: Rust Test
        run: |
            cargo test --workspace --all-features
            cargo test --workspace

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-msrv
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-msrv

      - name: Verify MSRV
        run: cargo msrv verify

  bench-codspeed:
    name: Benchmark with Codspeed
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c6id.8xlarge
      - image=ubuntu24-full-x64
      - tag=bench-codspeed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install libc debug symbols
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dbg

      - name: Install Codspeed
        shell: bash
        run: cargo install --force cargo-codspeed --locked

      - name: Build benchmarks
        env:
          RUSTFLAGS: "-C target-feature=+avx2"
        run: |
          cargo codspeed build --profile bench --features runtime

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
