name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  actions: read
  contents: read

concurrency:
  # Cancel superseded runs of the same PR; never cancel runs on develop.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Rust Lint - Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Rust Lint - Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all features
            flags: --all-features
          - name: default features
            flags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - run: cargo clippy --all-targets ${{ matrix.flags }}

  test:
    name: Rust Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all features
            flags: --all-features
          - name: default features
            flags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Rust Build
        run: cargo build --all-targets ${{ matrix.flags }}
      - name: Rust Test
        run: cargo test --workspace ${{ matrix.flags }}

  # Keeps the "Build" check that branch protection may require: it passes only when
  # every parallel lint, build and test job passed.
  build:
    name: Build
    needs: [fmt, clippy, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  test-avx512:
    name: Test AVX-512 (Intel SDE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install Intel SDE
        env:
          SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
          SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sde.tar.xz" "$SDE_URL"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1
          echo "$RUNNER_TEMP/sde" >> "$GITHUB_PATH"

      # The runners have no AVX-512, so the tests run on an emulated Ice Lake CPU. The tests
      # fail if FASTLANES_EXPECT_AVX512 is set and the dispatch does not detect AVX-512.
      - name: Rust Test - Transpose on Ice Lake
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sde64 -icl --
          FASTLANES_EXPECT_AVX512: "1"
        run: cargo test --features runtime --lib transpose

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-msrv
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-msrv

      - name: Verify MSRV
        run: cargo msrv verify

  bench-codspeed:
    name: Benchmark with Codspeed
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c6id.8xlarge
      - image=ubuntu24-full-x64
      - tag=bench-codspeed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install the debug symbols in the background while the toolchain is set up.
      - name: Start libc debug symbols install
        run: |
          (
            if sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libc6-dbg
            then status=0; else status=$?; fi
            echo "$status" > "$RUNNER_TEMP/apt.status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 &

      - uses: ./.github/actions/setup-rust

      - name: Install Codspeed
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-codspeed@6.1.0

      - name: Wait for libc debug symbols
        run: |
          timeout 300 bash -c 'until [ -f "$RUNNER_TEMP/apt.status" ]; do sleep 1; done'
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"

      - name: Build benchmarks
        env:
          RUSTFLAGS: "-C target-feature=+avx2"
        run: |
          cargo codspeed build --profile bench --features runtime

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
