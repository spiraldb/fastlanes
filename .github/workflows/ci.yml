name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-rust

      - name: Rust Build
        run: cargo build --all-features --all-targets
      - name: Rust Lint - Format
        run: cargo fmt --all --check
      - name: Rust Lint - Clippy
        run: cargo clippy --all-features --all-targets
      - name: Rust Test
        run: cargo test --workspace --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-msrv
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e # v2
        with:
          tool: cargo-msrv

      - name: Verify MSRV
        run: cargo msrv verify

  bench-codspeed:
    name: Bench ${{ matrix.variant.name }} (${{ matrix.mode }})
    strategy:
      # Report every variant/mode even if one leg fails.
      fail-fast: false
      matrix:
        # Both CodSpeed measurement modes for every variant: `simulation` is the
        # deterministic cachegrind-style cycle count (best for cross-variant
        # comparison), `walltime` is real wall-clock timing on the runner.
        mode: [ simulation, walltime ]
        # Each variant compiles with a distinct `target-feature` set and exports
        # a matching BENCH_VARIANT, so the benchmark names (and therefore the
        # CodSpeed URIs) are namespaced per CPU feature / arch instead of
        # colliding. See `variant!` in benches/shared.
        variant:
          - name: avx2
            family: c6id.8xlarge        # x86-64 (Intel Ice Lake)
            image: ubuntu24-full-x64
            rustflags: "-C target-feature=+avx2"
          - name: avx512
            family: c6id.8xlarge        # same silicon, AVX-512 enabled
            image: ubuntu24-full-x64
            rustflags: "-C target-feature=+avx512f,+avx512bw,+avx512cd,+avx512dq,+avx512vl"
          - name: sve
            family: c7g.8xlarge         # aarch64 (Graviton3, SVE)
            image: ubuntu24-full-arm64
            rustflags: "-C target-feature=+sve"
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=${{ matrix.variant.family }}
      - image=${{ matrix.variant.image }}
      - tag=bench-${{ matrix.variant.name }}-${{ matrix.mode }}
    env:
      # Baked into the benchmark names at build time via env!() (see variant!).
      BENCH_VARIANT: ${{ matrix.variant.name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-rust

      - name: Install Codspeed
        shell: bash
        run: cargo install --force cargo-codspeed --locked

      - name: Build benchmarks
        env:
          RUSTFLAGS: ${{ matrix.variant.rustflags }}
        run: |
          cargo codspeed build --measurement-mode ${{ matrix.mode }} --profile bench

      - name: Run benchmarks
        uses: CodSpeedHQ/action@3194d9a39c4d46684cb44bf7207fc56626aad8fd # v4
        with:
          run: cargo codspeed run --measurement-mode ${{ matrix.mode }}
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: ${{ matrix.mode }}
